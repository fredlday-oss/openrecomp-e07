name: IR V1.1 divrem semantics V1

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ir-v1-1-divrem-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies and compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc clang
          python -m pip install jsonschema
      - name: Preserve frozen V1 behavior
        run: |
          python tools/test_ir_v1.py
          python tools/test_mips32_expansion_v1.py
      - name: Validate V1.1 div/rem semantic contract
        run: python tools/test_ir_v1_1_divrem.py
      - name: Run bounded MIPS32 div/rem reference Core and AOT matrix
        shell: bash
        run: |
          set -euo pipefail
          root=build/ir-v1-1-divrem
          mkdir -p "$root"
          hex=examples/mips32-divrem-v1/divrem.hex
          meta=examples/mips32-divrem-v1/divrem.json
          python tools/mips32_divrem_frontend_v1.py "$hex" "$meta" contracts/host_contract.json "$root/a.ir.json" "$root/a.sidecar.json" "$root/a.frontend.json"
          python tools/mips32_divrem_frontend_v1.py "$hex" "$meta" contracts/host_contract.json "$root/b.ir.json" "$root/b.sidecar.json" "$root/b.frontend.json"
          cmp "$root/a.ir.json" "$root/b.ir.json"; cmp "$root/a.sidecar.json" "$root/b.sidecar.json"; cmp "$root/a.frontend.json" "$root/b.frontend.json"
          python tools/validate_ir_v1_1.py "$root/a.ir.json"
          python tools/run_mips32_divrem_reference.py "$hex" "$meta" "$root/reference.json"
          python tools/package_ir_v1_1_module.py "$root/a.ir.json" "$root/a.sidecar.json" contracts/host_contract.json "$root/a.module.json"
          python tools/package_ir_v1_1_module.py "$root/b.ir.json" "$root/b.sidecar.json" contracts/host_contract.json "$root/b.module.json"
          cmp "$root/a.module.json" "$root/b.module.json"
          python tools/run_mips32_divrem_core_v1.py "$root/a.module.json" "$root/a.ir.json" contracts/host_contract.json "$meta" "$root/core.json"
          python tools/aot_c_backend_v1_1.py "$root/a.module.json" "$root/a.ir.json" contracts/host_contract.json "$root/a.c"
          python tools/aot_c_backend_v1_1.py "$root/a.module.json" "$root/a.ir.json" contracts/host_contract.json "$root/b.c"
          cmp "$root/a.c" "$root/b.c"
          python tools/native_aot_abi_v1_1.py "$root/a.module.json" "$root/a.ir.json" contracts/host_contract.json "$root/abi.a.c"
          python tools/native_aot_abi_v1_1.py "$root/a.module.json" "$root/a.ir.json" contracts/host_contract.json "$root/abi.b.c"
          cmp "$root/abi.a.c" "$root/abi.b.c"
          gcc -std=c11 -O2 -Wall -Wextra -Werror -fPIC -fvisibility=hidden -Iinclude -shared "$root/a.c" "$root/abi.a.c" -o "$root/gcc.so"
          clang -std=c11 -O2 -Wall -Wextra -Werror -fPIC -fvisibility=hidden -Iinclude -shared "$root/a.c" "$root/abi.a.c" -o "$root/clang.so"
          python tools/run_aot_mips32_divrem_v1.py "$root/gcc.so" "$root/a.ir.json" "$meta" "$root/aot.gcc.json"
          python tools/run_aot_mips32_divrem_v1.py "$root/clang.so" "$root/a.ir.json" "$meta" "$root/aot.clang.json"
          python tools/check_mips32_divrem_v1.py "$meta" "$root/a.frontend.json" "$root/a.ir.json" "$root/a.module.json" "$root/reference.json" "$root/core.json" "$root/aot.gcc.json" "$root/aot.clang.json"
          echo "OPENRECOMP_IR_V1_1_DIVREM_SEMANTICS_V1=PASS"
      - uses: actions/upload-artifact@v4
        with:
          name: openrecomp-ir-v1-1-divrem-semantics-v1
          path: build/ir-v1-1-divrem
          if-no-files-found: error
