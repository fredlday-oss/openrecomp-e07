name: MIPS32 Translation V1 Gate
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python -m pip install "jsonschema>=4,<5"
      
      - name: Verify source integrity
        run: python update_sums.py && git diff --exit-code SOURCE_SHA256SUMS.txt
      
      - name: Semantic Microtests
        run: python tools/test_mips32_microtests_v1.py
      
      - name: MIPS32 Ingestion
        run: python tools/test_mips32_frontend_v1.py
        
      - name: IR/Core Regressions
        run: |
          python tools/test_ir_v1.py
          python tools/test_core_api_v1.py
          
      - name: RV32I Regressions
        run: bash RUN.sh

      - name: Diagnose native reproducibility
        if: failure()
        shell: bash
        run: |
          if [[ -f build/fixture_native && -f build/fixture_native_2 ]]; then
            sha256sum build/fixture_native build/fixture_native_2 || true
            cmp -l build/fixture_native build/fixture_native_2 | head -40 || true
            objdump -x build/fixture_native > build/native1.headers.txt || true
            objdump -x build/fixture_native_2 > build/native2.headers.txt || true
            diff -u build/native1.headers.txt build/native2.headers.txt || true
          fi
