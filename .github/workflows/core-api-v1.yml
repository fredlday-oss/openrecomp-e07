name: Core API V1

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install jsonschema
      - name: Run Core API V1 tests
        run: python tools/test_core_api_v1.py
