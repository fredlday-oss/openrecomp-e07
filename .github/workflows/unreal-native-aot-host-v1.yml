name: Unreal Native AOT host V1

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Unreal Native AOT source contract
        run: python tools/verify_unreal_native_aot_host_v1.py

  prepare-rv32i-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install proof dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld gcc
          python -m pip install jsonschema

      - name: Build validated RV32I Module Image input
        run: |
          chmod +x RUN.sh
          ./RUN.sh
          mkdir -p build/unreal-native-aot-host-v1

          python tools/bridge_rv32i_ir_v1.py \
            build/fixture_full.ir.json \
            contracts/host_contract.json \
            build/unreal-native-aot-host-v1/rv32i.ir.json \
            build/unreal-native-aot-host-v1/rv32i.sidecar.json

          python tools/package_ir_v1_module.py \
            build/unreal-native-aot-host-v1/rv32i.ir.json \
            build/unreal-native-aot-host-v1/rv32i.sidecar.json \
            contracts/host_contract.json \
            build/unreal-native-aot-host-v1/rv32i.module.json

          python tools/run_core_api_v1.py \
            build/unreal-native-aot-host-v1/rv32i.module.json \
            build/unreal-native-aot-host-v1/rv32i.ir.json \
            contracts/host_contract.json \
            build/unreal-native-aot-host-v1/rv32i.core.json

          echo "OPENRECOMP_UNREAL_NATIVE_AOT_REFERENCE_INPUT=PASS"

      - uses: actions/upload-artifact@v4
        with:
          name: openrecomp-unreal-native-aot-host-v1-inputs
          path: build/unreal-native-aot-host-v1
          if-no-files-found: error

  windows-host-core:
    name: Unreal Native AOT host V1
    needs: [source-contract, prepare-rv32i-module]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: pwsh
        run: python -m pip install jsonschema

      - uses: actions/download-artifact@v4
        with:
          name: openrecomp-unreal-native-aot-host-v1-inputs
          path: build/unreal-native-aot-host-v1

      - name: Generate portable C and ABI adapters deterministically
        shell: pwsh
        run: |
          python tools/aot_c_backend_v1.py build/unreal-native-aot-host-v1/rv32i.module.json build/unreal-native-aot-host-v1/rv32i.ir.json contracts/host_contract.json build/unreal-native-aot-host-v1/rv32i.a.c
          python tools/aot_c_backend_v1.py build/unreal-native-aot-host-v1/rv32i.module.json build/unreal-native-aot-host-v1/rv32i.ir.json contracts/host_contract.json build/unreal-native-aot-host-v1/rv32i.b.c
          python tools/native_aot_abi_v1.py build/unreal-native-aot-host-v1/rv32i.module.json build/unreal-native-aot-host-v1/rv32i.ir.json contracts/host_contract.json build/unreal-native-aot-host-v1/rv32i.abi.a.c
          python tools/native_aot_abi_v1.py build/unreal-native-aot-host-v1/rv32i.module.json build/unreal-native-aot-host-v1/rv32i.ir.json contracts/host_contract.json build/unreal-native-aot-host-v1/rv32i.abi.b.c

          if ((Get-FileHash build/unreal-native-aot-host-v1/rv32i.a.c -Algorithm SHA256).Hash -ne (Get-FileHash build/unreal-native-aot-host-v1/rv32i.b.c -Algorithm SHA256).Hash) { throw "RV32I portable C generation differs on Windows" }
          if ((Get-FileHash build/unreal-native-aot-host-v1/rv32i.abi.a.c -Algorithm SHA256).Hash -ne (Get-FileHash build/unreal-native-aot-host-v1/rv32i.abi.b.c -Algorithm SHA256).Hash) { throw "RV32I ABI adapter generation differs on Windows" }
          Write-Output "OPENRECOMP_UNREAL_NATIVE_AOT_CODEGEN=PASS"

      - name: Build AOT DLLs and host-core harnesses with MSVC and clang-cl
        shell: cmd
        run: |
          @for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do @set "VSINSTALL=%%i"
          @if not defined VSINSTALL (echo Visual Studio C++ toolchain not found & exit /b 2)
          @call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          @where cl
          @where clang-cl

          cl /nologo /std:c11 /O2 /W4 /WX /LD /Iinclude build\unreal-native-aot-host-v1\rv32i.a.c build\unreal-native-aot-host-v1\rv32i.abi.a.c /link /OUT:build\unreal-native-aot-host-v1\openrecomp-e07-rv32i-msvc.dll
          clang-cl /nologo /std:c11 /O2 /W4 /WX /LD /Iinclude build\unreal-native-aot-host-v1\rv32i.a.c build\unreal-native-aot-host-v1\rv32i.abi.a.c /link /OUT:build\unreal-native-aot-host-v1\openrecomp-e07-rv32i-clangcl.dll

          cl /nologo /std:c++17 /EHsc /O2 /W4 /WX /Iinclude /Iintegrations\unreal integrations\unreal\OpenRecompNativeAotHostCoreV1.cpp tools\unreal_native_aot_host_v1_harness.cpp /Fe:build\unreal-native-aot-host-v1\unreal-host-msvc.exe
          clang-cl /nologo /std:c++17 /EHsc /O2 /W4 /WX /Iinclude /Iintegrations\unreal integrations\unreal\OpenRecompNativeAotHostCoreV1.cpp tools\unreal_native_aot_host_v1_harness.cpp /Fe:build\unreal-native-aot-host-v1\unreal-host-clangcl.exe

      - name: Execute cross-toolchain host/module matrix
        shell: pwsh
        run: |
          $cases = @(
            @("unreal-host-msvc.exe", "openrecomp-e07-rv32i-msvc.dll", "msvc-host_msvc-module.txt"),
            @("unreal-host-msvc.exe", "openrecomp-e07-rv32i-clangcl.dll", "msvc-host_clangcl-module.txt"),
            @("unreal-host-clangcl.exe", "openrecomp-e07-rv32i-msvc.dll", "clangcl-host_msvc-module.txt"),
            @("unreal-host-clangcl.exe", "openrecomp-e07-rv32i-clangcl.dll", "clangcl-host_clangcl-module.txt")
          )

          foreach ($case in $cases) {
            $exe = Join-Path "build/unreal-native-aot-host-v1" $case[0]
            $dll = Join-Path "build/unreal-native-aot-host-v1" $case[1]
            $log = Join-Path "build/unreal-native-aot-host-v1" $case[2]
            & $exe $dll | Tee-Object -FilePath $log
            if ($LASTEXITCODE -ne 0) { throw "Native AOT host-core matrix case failed: $($case[0]) / $($case[1])" }
            $text = Get-Content $log -Raw
            if ($text -notmatch "OPENRECOMP_UNREAL_NATIVE_AOT_HOST_CORE_V1=PASS") { throw "PASS marker missing from $log" }
            if ($text -notmatch "UNREAL_NATIVE_AOT_CHECKSUM=122010428") { throw "checksum mismatch in $log" }
          }

          Write-Output "OPENRECOMP_UNREAL_NATIVE_AOT_HOST_V1_MSVC_CLANGCL_MATRIX=PASS"
          Write-Output "OPENRECOMP_UNREAL_NATIVE_AOT_HOST_V1_HOST_CORE=PASS"

      - name: Create synthetic module handoff manifest
        shell: pwsh
        run: |
          $out = "build/unreal-native-aot-host-v1"
          Copy-Item "$out/openrecomp-e07-rv32i-msvc.dll" "$out/openrecomp-e07-rv32i.dll" -Force
          $files = @(
            "$out/openrecomp-e07-rv32i.dll",
            "$out/openrecomp-e07-rv32i-clangcl.dll",
            "integrations/unreal/OpenRecompNativeAotHostCoreV1.h",
            "integrations/unreal/OpenRecompNativeAotHostCoreV1.cpp",
            "integrations/unreal/OpenRecompNativeAotHostV1.h",
            "integrations/unreal/OpenRecompNativeAotHostV1.cpp",
            "integrations/unreal/OpenRecompNativeAotHostActor.h",
            "integrations/unreal/OpenRecompNativeAotHostActor.cpp",
            "include/openrecomp/native_aot_abi_v1.h"
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $file"
          }
          $lines | Set-Content "$out/UNREAL_NATIVE_AOT_HOST_V1_SHA256SUMS.txt" -Encoding ascii
          "OPENRECOMP_UNREAL_NATIVE_AOT_HOST_V1_ARTIFACT=READY" | Set-Content "$out/RESULT.txt" -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: openrecomp-unreal-native-aot-host-v1-handoff
          path: |
            build/unreal-native-aot-host-v1/openrecomp-e07-rv32i.dll
            build/unreal-native-aot-host-v1/openrecomp-e07-rv32i-clangcl.dll
            build/unreal-native-aot-host-v1/*host_*.txt
            build/unreal-native-aot-host-v1/UNREAL_NATIVE_AOT_HOST_V1_SHA256SUMS.txt
            build/unreal-native-aot-host-v1/RESULT.txt
            integrations/unreal/OpenRecompNativeAotHostCoreV1.h
            integrations/unreal/OpenRecompNativeAotHostCoreV1.cpp
            integrations/unreal/OpenRecompNativeAotHostV1.h
            integrations/unreal/OpenRecompNativeAotHostV1.cpp
            integrations/unreal/OpenRecompNativeAotHostActor.h
            integrations/unreal/OpenRecompNativeAotHostActor.cpp
            include/openrecomp/native_aot_abi_v1.h
          if-no-files-found: error
