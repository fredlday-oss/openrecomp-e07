name: MIPS32 vertical slice V1

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mips32-vertical-slice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: python -m pip install jsonschema

      - name: Run frontend rejection tests
        run: python tools/test_mips32_frontend_v1.py

      - name: Lower synthetic MIPS32 fixture twice
        run: |
          mkdir -p build/mips32-v1
          python tools/mips32_frontend_v1.py \
            examples/mips32-v1/fixture.hex \
            examples/mips32-v1/fixture.json \
            contracts/host_contract.json \
            build/mips32-v1/fixture.a.ir.json \
            build/mips32-v1/fixture.a.sidecar.json \
            build/mips32-v1/fixture.a.frontend.json
          python tools/mips32_frontend_v1.py \
            examples/mips32-v1/fixture.hex \
            examples/mips32-v1/fixture.json \
            contracts/host_contract.json \
            build/mips32-v1/fixture.b.ir.json \
            build/mips32-v1/fixture.b.sidecar.json \
            build/mips32-v1/fixture.b.frontend.json
          cmp build/mips32-v1/fixture.a.ir.json build/mips32-v1/fixture.b.ir.json
          cmp build/mips32-v1/fixture.a.sidecar.json build/mips32-v1/fixture.b.sidecar.json
          cmp build/mips32-v1/fixture.a.frontend.json build/mips32-v1/fixture.b.frontend.json
          echo "OPENRECOMP_MIPS32_NORMALIZATION_DETERMINISTIC=PASS"

      - name: Validate normalized IR V1
        run: python tools/validate_ir_v1.py build/mips32-v1/fixture.a.ir.json

      - name: Execute independent MIPS32 reference
        run: |
          python tools/run_mips32_reference.py \
            examples/mips32-v1/fixture.hex \
            examples/mips32-v1/fixture.json \
            build/mips32-v1/reference.json

      - name: Package Module Image V1 twice
        run: |
          python tools/package_ir_v1_module.py \
            build/mips32-v1/fixture.a.ir.json \
            build/mips32-v1/fixture.a.sidecar.json \
            contracts/host_contract.json \
            build/mips32-v1/fixture.a.module.json
          python tools/package_ir_v1_module.py \
            build/mips32-v1/fixture.b.ir.json \
            build/mips32-v1/fixture.b.sidecar.json \
            contracts/host_contract.json \
            build/mips32-v1/fixture.b.module.json
          cmp build/mips32-v1/fixture.a.module.json build/mips32-v1/fixture.b.module.json
          echo "OPENRECOMP_MIPS32_MODULE_PACKAGING_DETERMINISTIC=PASS"

      - name: Validate Module Image V1
        run: |
          python tools/validate_module_v1.py \
            build/mips32-v1/fixture.a.module.json \
            build/mips32-v1/fixture.a.ir.json \
            contracts/host_contract.json

      - name: Execute through shared Core API V1
        run: |
          python tools/run_mips32_core_v1.py \
            build/mips32-v1/fixture.a.module.json \
            build/mips32-v1/fixture.a.ir.json \
            contracts/host_contract.json \
            examples/mips32-v1/fixture.json \
            build/mips32-v1/core.json

      - name: Compare machine-code reference and Core API paths
        run: |
          python tools/check_mips32_vertical_slice.py \
            examples/mips32-v1/fixture.json \
            build/mips32-v1/fixture.a.frontend.json \
            build/mips32-v1/fixture.a.ir.json \
            build/mips32-v1/fixture.a.module.json \
            build/mips32-v1/reference.json \
            build/mips32-v1/core.json | tee build/mips32-v1/equivalence.txt
          grep -F "OPENRECOMP_MIPS32_VERTICAL_SLICE_V1=PASS" build/mips32-v1/equivalence.txt
