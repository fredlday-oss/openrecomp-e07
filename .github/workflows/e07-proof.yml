name: E07 hardened proof

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld gcc
          python -m pip install --upgrade pip
          python -m pip install jsonschema

      - name: Verify source integrity
        run: sha256sum -c SOURCE_SHA256SUMS.txt

      - name: Run hardened proof
        run: |
          chmod +x RUN.sh
          ./RUN.sh | tee /tmp/openrecomp-e07.log
          grep -F "PASS: E07 V1.1 HARDENED END-TO-END" /tmp/openrecomp-e07.log

      - name: Verify proof classifications
        run: |
          python - <<'PY'
          import json
          result = json.load(open("evidence/E07_RESULT.json", encoding="utf-8"))
          classification = result["classification"]
          assert classification["riscv32_fixture_path"] == "PROVEN", classification
          assert classification["mips32_second_adapter"] == "CANDIDATE", classification
          print("OPENRECOMP_E07_CLASSIFICATION=PASS")
          PY

      - name: Verify host parity evidence
        run: |
          test -s evidence/native_run.txt
          test -s evidence/wasm_run.txt
          grep -F "PASS: two host targets execute identically" evidence/portable_hosts.txt

      - name: Normalize RV32I legacy IR to normalized IR V1 twice
        run: |
          python tools/bridge_rv32i_ir_v1.py build/fixture_full.ir.json contracts/host_contract.json build/fixture_full.v1.a.json build/fixture_full.v1.sidecar.a.json
          python tools/bridge_rv32i_ir_v1.py build/fixture_full.ir.json contracts/host_contract.json build/fixture_full.v1.b.json build/fixture_full.v1.sidecar.b.json
          cmp build/fixture_full.v1.a.json build/fixture_full.v1.b.json
          cmp build/fixture_full.v1.sidecar.a.json build/fixture_full.v1.sidecar.b.json
          echo "OPENRECOMP_RV32I_IR_V1_NORMALIZATION_DETERMINISTIC=PASS"

      - name: Validate normalized IR V1
        run: python tools/validate_ir_v1.py build/fixture_full.v1.a.json

      - name: Execute normalized IR V1 bridge
        run: |
          python tools/run_ir_v1_bridge.py build/fixture_full.v1.a.json build/fixture_full.v1.sidecar.a.json contracts/host_contract.json build/fixture_full.v1.result.json | tee evidence/rv32i_ir_v1_bridge_runtime.txt

      - name: Compare normalized path with proven E07 baseline
        run: |
          python tools/check_rv32i_ir_v1_bridge.py build/fixture_full.ir.json build/fixture_full.v1.a.json build/fixture_full.v1.result.json golden/state.json evidence/native_run.txt | tee evidence/rv32i_ir_v1_bridge_equivalence.txt
          grep -F "OPENRECOMP_RV32I_IR_V1_EQUIVALENCE=PASS" evidence/rv32i_ir_v1_bridge_equivalence.txt

      - name: Package normalized IR as Core API module twice
        run: |
          python tools/package_ir_v1_module.py build/fixture_full.v1.a.json build/fixture_full.v1.sidecar.a.json contracts/host_contract.json build/fixture_full.module.a.json
          python tools/package_ir_v1_module.py build/fixture_full.v1.b.json build/fixture_full.v1.sidecar.b.json contracts/host_contract.json build/fixture_full.module.b.json
          cmp build/fixture_full.module.a.json build/fixture_full.module.b.json
          echo "OPENRECOMP_MODULE_V1_PACKAGING_DETERMINISTIC=PASS"

      - name: Validate Module Image V1
        run: python tools/validate_module_v1.py build/fixture_full.module.a.json build/fixture_full.v1.a.json contracts/host_contract.json

      - name: Execute through Core API V1
        run: |
          python tools/run_core_api_v1.py build/fixture_full.module.a.json build/fixture_full.v1.a.json contracts/host_contract.json build/fixture_full.core-api-v1.result.json | tee evidence/core_api_v1_runtime.txt

      - name: Compare Core API with bridge and proven E07 baseline
        run: |
          python tools/check_core_api_v1.py build/fixture_full.module.a.json build/fixture_full.core-api-v1.result.json build/fixture_full.v1.result.json golden/state.json evidence/native_run.txt | tee evidence/core_api_v1_equivalence.txt
          grep -F "OPENRECOMP_CORE_API_V1_EQUIVALENCE=PASS" evidence/core_api_v1_equivalence.txt
