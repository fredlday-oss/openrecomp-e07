name: Release v0.2 metadata

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify v0.2.0 release metadata
        run: python tools/verify_release_v0_2_0.py
      - name: Public safety
        run: python tools/public_safety_scan.py
      - name: Documentation links
        run: python tools/check_markdown_links.py
